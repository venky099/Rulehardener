title: Suspicious PowerShell Execution
id: 8c7b1e12-1111-4444-8888-123456789abc
status: experimental
description: Detects suspicious PowerShell command-line activity with encoded commands.
author: Threat Research Team
date: 2026/01/15
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\powershell.exe'
    CommandLine|contains: 'EncodedCommand'
  condition: selection
level: medium
tags:
  - attack.execution
  - attack.t1059.001
falsepositives:
  - Legitimate administrative automation scripts using base64 payloads
